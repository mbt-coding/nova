<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>NOVA AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0507">
<link rel="icon" type="image/svg+xml" href="assets/images/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<div id="app">
<header><button class="ib" id="hb" aria-label="Chat history">☰</button><div class="sg">NOVA<small id="stx">Ready</small></div><button class="ib" id="sb" aria-label="Settings">⚙</button></header>
<main id="main"><div id="hero"><canvas id="orb" aria-label="Animated red black hole. Tap to stop speech."></canvas><h2>How can I help?</h2><p>Type, or tap the mic and speak.</p><div id="chips"></div></div><div id="msgs" aria-live="polite"></div></main>
<footer><button class="ib" id="mic" aria-label="Voice input">🎙</button><textarea id="in" rows="1" placeholder="Message NOVA" aria-label="Message"></textarea><button class="ib" id="go" aria-label="Send" disabled>➤</button></footer>
<aside class="sheet" id="hist"><h2>Chats <button class="ib" data-x="hist" aria-label="Close">✕</button></h2><button id="nc" class="wide">+ New chat</button><div class="row2"><button id="ex">Export chat</button><button id="clr">Clear all</button></div><div id="hl"></div></aside>
<aside class="sheet" id="set"><h2>Settings <button class="ib" data-x="set" aria-label="Close">✕</button></h2><label>Appearance</label><div class="row2"><button id="td">Dark mode</button><button id="tl">Light mode</button></div></aside>
<div id="toast" role="status"></div></div>
<script src="js/config.js"></script><script src="js/script.js"></script></body></html>
